[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vinculum-query-api"
version = "0.1.1"
description = "Serve configured read-only SQL queries through a JSON API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "SQLAlchemy>=2.0.43,<2.2",
    "sqlglot>=30,<31",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["PyMySQL[rsa]>=1.1,<2"]
oracle = ["oracledb>=3,<27"]
all = ["psycopg[binary]>=3.2,<4", "PyMySQL[rsa]>=1.1,<2", "oracledb>=3,<27"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
vinculum = "vinculum.__main__:main"

[tool.setuptools]
packages = ["vinculum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
